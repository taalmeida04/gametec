<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <header class="cabecalho">
        <div class="logo">
            <h1>ARCADE</h1>
        </div>
        <div class="usuario">
            <img src="/assets/img/moeda.png" alt="Moedas" class="icone-moeda">
            
        </div>
    </header>

    <main class="inicio">
        <h1>GameTec</h1>
        <h4>Escolha uma opção</h4>

        <section class="opcoes">
            <a href="./html/jogos/jogos.html" class="card card-jogos">
                <img src="/assets/img/controle.png" alt="Ícone de jogos" class="icone-card">
                <h3>Jogos</h3>
                <span class="seta">➜</span>
            </a>

            <a href="./html/sobre/sobre.html" class="card card-sobre">
                <img src="/assets/img/trofeu.png" alt="Ícone sobre" class="icone-card">
                <h3>Sobre</h3>
                <span class="seta">➜</span>
            </a>
        </section>
    </main>
</body>
</html>
