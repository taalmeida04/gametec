<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arcade</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

</head>

<body>

    <header class="cabecalho">
        <div class="logo">
            <h1>ARCADE</h1>
        </div>

        <div class="usuario">
            <img src="/assets/img/moeda.png" alt="Moedas" class="icone-moeda">
            <span>01802</span>
        </div>

    </header>

    <main class="inicio">
        <h1>GameTec</h1>
        <h4>Escolha uma opção</h4>

        <section class="opcoes">
            <a href="./html/jogos/jogos.html" class="card card-jogos">

                <img src="/assets/img/controle.png" alt="Ícone de jogos" class="icone-card">

                <h3>Jogos</h3>

                <span class="seta">➜</span>

            </a>

            <a href="./html/resultados.html" class="card card-resultados">

                <img src="/assets/img/trofeu.png" alt="Ícone de resultados" class="icone-card">

                <h3>Resultados</h3>

                <span class="seta">➜</span>

            </a>
            <a href="./html/configuraçoes.html" class="card card-configuracoes">

                <img src="/assets/img/config.png" alt="Ícone de configurações" class="icone-card">

                <h3>Configurações</h3>

                <span class="seta">➜</span>

            </a>


        </section>
    </main>

</body>

</html>
