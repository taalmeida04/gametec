<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo da Velha</title>

    <link rel="stylesheet" href="../../css/jogos/velha.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="cabecalho">

        <div class="logo">
            <h1>GameTec</h1>
        </div>

        <div class="usuario">
            <img src="/assets/img/moeda.png" alt="Moedas" class="icone-moeda">

        </div>

    </header>

    <main class="inicio">

        <a href="./jogos.html" class="voltar">
            <img src="../../assets/img/mario/voltar.png" alt="Voltar">
        </a>

        <div id="escolha">

            <h1>Jogo da Velha</h1>

            <p>Escolha como você vai jogar</p>

            <section class="opcoes">

                <div class="card-jogo">

                    <img src="../../assets/img/mario/mario solo.png" alt="Mario jogando" class="imagem-jogo">

                    <h3>CONTRA A MÁQUINA</h3>

                    <button id="botaoMaquina">
                        Jogar
                    </button>

                </div>

                <div class="card-jogo">

                    <img src="../../assets/img/mario/vs.png" alt="Mario e Luigi jogando" class="imagem-jogo">

                    <h3>CONTRA UM AMIGO</h3>

                    <button id="botaoAmigo">
                        Jogar
                    </button>

                </div>

            </section>

        </div>

        <div id="jogo">

            <h1>Jogo da Velha</h1>

            <p id="jogador">
                Vez do jogador: X
            </p>

            <section class="tabuleiro">

                <div class="casa"></div>
                <div class="casa"></div>
                <div class="casa"></div>

                <div class="casa"></div>
                <div class="casa"></div>
                <div class="casa"></div>

                <div class="casa"></div>
                <div class="casa"></div>
                <div class="casa"></div>

            </section>

            <button id="botaoReiniciar">
                Reiniciar
            </button>

        </div>

        <div class="resultado" id="resultado">

            <div class="resultado-card">

                <img src="../../assets/img/mario/voltar.png" alt="Estrela" class="icone-resultado">

                <h2 id="resultadoTitulo">
                    PARABÉNS!
                </h2>

                <p id="resultadoMensagem">
                    Você venceu!
                </p>

                <div class="resultado-botoes">

                    <button id="jogarNovamente">
                        Jogar Novamente
                    </button>

                    <a href="./jogos.html" class="botao-lobby">
                        Voltar ao Lobby
                    </a>

                </div>

            </div>

        </div>

    </main>

    <script src="../../Js/velha.js"></script>

</body>

</html>
